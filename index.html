<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Battle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="interface">
        <div>❤️ Vida: <span id="vida">100</span></div>
        <div>🎯 Pontos: <span id="pontos">0</span></div>
        <div>🌊 Onda: <span id="onda">1</span></div>
    </div>

    <canvas id="game"></canvas>

    <div id="mensagem" class="escondido">
        <h1>GAME OVER</h1>
        <p>Pontos: <span id="pontuacaoFinal">0</span></p>
        <button onclick="reiniciarJogo()">Jogar novamente</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
