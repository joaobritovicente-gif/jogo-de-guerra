<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Tanque de Guerra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>Batalha de Tanques</h1>
        <div id="ui">
            <span>Pontuação: <b id="score">0</b></span>
            <span>Vida: <b id="health">100</b>%</span>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <p class="controls">Controles: <b>W, A, S, D</b> ou <b>Setas</b> para mover | <b>Espaço</b> para atirar</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
