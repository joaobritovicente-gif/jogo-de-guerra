<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Tanque 3D</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <div>Pontuação: <b id="score">0</b></div>
        <div>Vida: <b id="health">100</b>%</div>
    </div>
    
    <div id="game-over" class="hidden">
        <h1>FIM DE JOGO</h1>
        <p>Pressione F5 para jogar novamente</p>
    </div>

    <div id="controls-info">Controles: <b>W, S</b> (Avançar/Mover) | <b>A, D</b> (Girar) | <b>Espaço</b> (Atirar)</div>

    <script src="script.js"></script>
</body>
</html>
