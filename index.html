<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tank Battle 3D</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="interface">

        <div>❤️ Vida: <span id="vida">100</span></div>
        <div>🎯 Pontos: <span id="pontos">0</span></div>
        <div>🔴 Inimigos: <span id="inimigos">0</span></div>

    </div>


    <div id="mensagem">
        <h1>TANK BATTLE 3D</h1>

        <p>W A S D = mover</p>
        <p>Mouse = mirar</p>
        <p>Clique = atirar</p>

        <button id="comecar">
            COMEÇAR
        </button>
    </div>


    <div id="gameOver" class="escondido">

        <h1>TANQUE DESTRUÍDO</h1>

        <p>
            Pontos:
            <span id="pontuacaoFinal">0</span>
        </p>

        <button id="reiniciar">
            JOGAR NOVAMENTE
        </button>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

    <script src="game.js"></script>

</body>
</html>
